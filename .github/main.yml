name: CI/CD Actividad 6.1

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Inicio de sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.erickamasonense }}
          password: ${{ secrets.dckr_pat_0L_GeFJm8hTTQ9niK2R6lpImfjo }}

      - name: Construcción y subida de la imagen (BUILD & PUSH)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.erickamasonense }}/actividad61-aplicacion-crud-php:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue en Servidor de Producción (PULL & RUN)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.10.0.12.130 }}
          username: ubuntu
          key: ${{ secrets.vockey.pem }}
          script: |
            cd ~/actividad61-aplicacion-php-produccion-
            docker compose pull
            docker compose up -d
